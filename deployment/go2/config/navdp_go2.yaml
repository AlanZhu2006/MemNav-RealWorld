navdp_go2_adapter:
  ros__parameters:
    # Machine/experiment-owned values (backend, mode, server, physical sensor
    # topics, command topic, ImageGoal and speed limits) are injected from the
    # immutable resolved runtime config by run_adapter.sh.
    image_goal_debug_topic: /navdp/image_goal
    path_topic: /navdp/trajectory
    status_topic: /navdp/status
    cec_receipt_topic: /navdp/cec_receipt
    debug_markers_topic: /navdp/debug/markers
    enable_topic: /navdp/enabled
    estop_topic: /navdp/estop
    arrival_topic: /navdp/arrival
    base_frame: base_link

    debug_visualization: true
    debug_max_candidates: 6
    enable_on_start: false
    estop_on_start: true
    plan_while_disabled: true
    two_phase_episode: false
    auto_goal_candidate_interval_frames: 24
    auto_goal_candidate_max: 6
    auto_goal_candidate_post_guard_frames: 4
    auto_select_goal_candidate: true
    planning_rate_hz: 1.5
    control_rate_hz: 20.0
    connect_timeout_s: 3.0
    request_timeout_s: 180.0
    # Admit a short Jetson RGB-D scheduling hiccup during inference.  The run
    # supervisor still requires <=0.60 s freshness before arming, while both
    # layers fail closed if delivery remains stale for a full second.
    sensor_timeout_s: 1.00
    trajectory_timeout_s: 5.00
    max_rgb_depth_skew_s: 0.10
    rgbd_sync_queue_size: 15
    depth_scale_m: 0.001
    lookahead_m: 0.60
    heading_deadband_rad: 0.13962634015954636  # 8 deg; validated TinyNav anti-hunting gate
    rotate_in_place_angle_rad: 0.70
    rotate_gain: 1.50
    slow_path_length_m: 1.00
    allow_reverse: false
    reverse_lateral_angle_rad: 0.55
    max_linear_accel_mps2: 0.45
    max_angular_accel_rps2: 1.00

    # Remote planning currently takes roughly 0.8-1.0 s.  Bound the angular
    # travel executed per stale observation, turn before translating, and
    # require two plans to agree before reversing steering direction.
    latency_motion_guard_enabled: true
    latency_max_open_loop_heading_rad: 0.17453292519943295  # 10 deg
    latency_max_plan_input_age_s: 1.50
    latency_turn_in_place_after_s: 0.45
    latency_turning_translation_cutoff_rps: 0.12
    latency_turning_creep_mps: 0.08
    latency_reversal_deadband_rps: 0.08
    latency_reversal_confirmation_plans: 2

    # Start at 0.10 m/s for 0.60 s, then retain the measured effective Go2
    # locomotion floor. Fail closed if one certified turn persists abnormally.
    certified_turn_bootstrap_s: 0.60
    certified_turn_max_s: 20.0

    # Tight indoor lab setting requested by the operator. The 0.80 m slowdown
    # envelope and fail-closed invalid-depth behavior remain unchanged.
    depth_hard_stop_m: 0.35
    depth_slow_distance_m: 0.80
    depth_percentile: 10.0
    depth_roi_left: 0.35
    depth_roi_right: 0.65
    depth_roi_top: 0.30
    depth_roi_bottom: 0.70
    depth_min_valid_fraction: 0.03
    depth_max_valid_m: 5.0
    depth_fail_closed: true
