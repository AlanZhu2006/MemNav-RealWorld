foxglove_bridge:
  ros__parameters:
    # Observation plus fail-closed operator services. Survey lifecycle calls
    # can only start recording for the config-bound dataset or revoke motion
    # and seal it. A browser must never gain process-start/reset/goal/parameter/
    # topic-publish or robot motion authority on a physical Go2.
    capabilities:
      - services
      - connectionGraph
    service_whitelist:
      - "^/navdp_go2_adapter/operator_stop$"
      - "^/navdp_go2_adapter/survey_start$"
      - "^/navdp_go2_adapter/survey_seal$"
      - "^/navdp_camera_recovery/restart$"
    param_whitelist:
      - "(?!)"
    client_topic_whitelist:
      - "(?!)"
    topic_whitelist:
      - "^/navdp/(arrival|cec_receipt|cmd_vel|enabled|estop|experiment_event|rgb_arrival_status|status|trajectory)$"
      - "^/navdp/debug/markers$"
      - "^/navdp/go2/battery$"
      - "^/navdp/operator/.*$"
      - "^/navdp/foxglove/.*"
      - "^/navdp/gt/.*"
      - "^/camera/camera/color/camera_info$"
      - "^/camera/camera/aligned_depth_to_color/camera_info$"
      - "^/rt/sportmodestate$"
      - "^/odin1/.*"
      - "^/tf$"
      - "^/tf_static$"
    include_hidden: false
    num_threads: 2
    min_qos_depth: 1
    max_qos_depth: 10
    best_effort_qos_topic_whitelist:
      - "^/camera/.*"
      - "^/navdp/foxglove/.*"
      - "^/odin1/(cloud_slam|odometry.*|path)$"
    sysinfo: true
    publish_client_count: true
    tls: false
