foxglove_bridge:
  ros__parameters:
    # Observation plus fixed, fail-closed operator orchestration. The guarded
    # Revisit service validates a sealed dataset, hardware and a fresh plan
    # before delegating to the supervised navigation runner. A browser never
    # receives raw reset/goal/parameter/topic-publish or motion services.
    capabilities:
      - services
      - connectionGraph
    service_whitelist:
      - "^/navdp_camera_recovery/restart$"
      - "^/memnav_operator/capture_goal$"
      - "^/memnav_operator/start_survey$"
      - "^/memnav_operator/stop_survey$"
      - "^/memnav_operator/start_revisit$"
      - "^/memnav_operator/operator_stop$"
    param_whitelist:
      - "(?!)"
    client_topic_whitelist:
      - "(?!)"
    topic_whitelist:
      - "^/navdp/(arrival|cec_receipt|cmd_vel|enabled|estop|experiment_event|rgb_arrival_status|status|trajectory)$"
      - "^/navdp/debug/markers$"
      - "^/navdp/go2/battery$"
      - "^/navdp/go2/body_heading$"
      - "^/navdp/go2/odometry$"
      - "^/navdp/operator/.*$"
      - "^/navdp/foxglove/.*"
      - "^/navdp/gt/.*"
      - "^/camera/camera/color/camera_info$"
      - "^/camera/camera/aligned_depth_to_color/camera_info$"
      - "^/rt/sportmodestate$"
      - "^/odin1/.*"
      - "^/tf$"
      - "^/tf_static$"
    include_hidden: false
    num_threads: 2
    min_qos_depth: 1
    max_qos_depth: 10
    best_effort_qos_topic_whitelist:
      - "^/camera/.*"
      - "^/navdp/foxglove/.*"
      - "^/odin1/(cloud_slam|odometry.*|path)$"
    sysinfo: true
    publish_client_count: true
    tls: false
