foxglove_bridge:
  ros__parameters:
    # Observation plus one fail-closed STOP service. A browser must never gain
    # start/reset/goal/parameter/topic-publish authority on a physical Go2.
    capabilities:
      - services
      - connectionGraph
    service_whitelist:
      - "^/navdp_go2_adapter/operator_stop$"
    param_whitelist:
      - "(?!)"
    client_topic_whitelist:
      - "(?!)"
    topic_whitelist:
      - "^/navdp/(arrival|cec_receipt|cmd_vel|enabled|estop|experiment_event|rgb_arrival_status|status|trajectory)$"
      - "^/navdp/debug/markers$"
      - "^/navdp/foxglove/.*"
      - "^/navdp/gt/.*"
      - "^/camera/camera/color/camera_info$"
      - "^/camera/camera/aligned_depth_to_color/camera_info$"
      - "^/rt/sportmodestate$"
      - "^/odin1/.*"
      - "^/tf$"
      - "^/tf_static$"
    include_hidden: false
    num_threads: 2
    min_qos_depth: 1
    max_qos_depth: 10
    best_effort_qos_topic_whitelist:
      - "^/camera/.*"
      - "^/navdp/foxglove/.*"
      - "^/odin1/(cloud_slam|odometry.*|path)$"
    sysinfo: true
    publish_client_count: true
    tls: false
