<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MemNav Real-World dual-machine architecture</title>
  <desc id="desc">RTX 4090 memory and policy inference connected through an SSH tunnel to robot-local sensing, control and safety on a Unitree Go2 Jetson.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="jetson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#fff7d6"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="1" stop-color="#ffe5ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d99a00"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d94072"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 20px Inter, Arial, sans-serif; fill: #536078; }
      .panelTitle { font: 700 27px Inter, Arial, sans-serif; fill: #172033; }
      .panelSub { font: 500 17px Inter, Arial, sans-serif; fill: #536078; }
      .boxTitle { font: 700 19px Inter, Arial, sans-serif; fill: #172033; }
      .boxText { font: 400 15px Inter, Arial, sans-serif; fill: #536078; }
      .label { font: 700 16px Inter, Arial, sans-serif; fill: #172033; }
      .small { font: 500 14px Inter, Arial, sans-serif; fill: #536078; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="62" text-anchor="middle" class="title">MemNav Real-World · Dual-Machine Architecture</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">Certified episodic memory on RTX 4090 · final motion authority on Unitree Go2</text>

  <rect x="55" y="135" width="690" height="690" rx="28" fill="url(#jetson)" stroke="#e6b62f" stroke-width="3" filter="url(#shadow)"/>
  <rect x="855" y="135" width="690" height="690" rx="28" fill="url(#gpu)" stroke="#df5c87" stroke-width="3" filter="url(#shadow)"/>

  <text x="90" y="185" class="panelTitle">ROBOT · Jetson Orin NX</text>
  <text x="90" y="214" class="panelSub">Unitree Go2 + RealSense D435i · ROS 2 Humble</text>
  <text x="890" y="185" class="panelTitle">POLICY · RTX 4090 Workstation</text>
  <text x="890" y="214" class="panelSub">Loopback-only inference services · no actuator interface</text>

  <rect x="100" y="250" width="600" height="90" rx="16" fill="#ffffff" stroke="#e6b62f" stroke-width="2"/>
  <text x="130" y="282" class="boxTitle">D435i aligned RGB-D</text>
  <text x="130" y="310" class="boxText">848×480 color + depth · CameraInfo · synchronized frame pair</text>

  <rect x="100" y="375" width="600" height="105" rx="16" fill="#ffffff" stroke="#e6b62f" stroke-width="2"/>
  <text x="130" y="407" class="boxTitle">ROS adapter + local trajectory tracker</text>
  <text x="130" y="435" class="boxText">24-point robot-frame path → lookahead vx / wz</text>
  <text x="130" y="458" class="boxText">RViz: RGB-D, candidates, chosen path, commands and stop reason</text>

  <rect x="100" y="515" width="600" height="125" rx="16" fill="#fff8df" stroke="#d99a00" stroke-width="3"/>
  <text x="130" y="547" class="boxTitle">Fail-closed safety boundary</text>
  <text x="130" y="575" class="boxText">RGB-D skew / age · depth clearance · plan age · estop · explicit enable</text>
  <text x="130" y="600" class="boxText">0.35 s bridge watchdog · remote-controller priority · no reverse</text>
  <text x="130" y="623" class="boxText">Default linear limit 0.30 m/s</text>

  <rect x="100" y="675" width="600" height="95" rx="16" fill="#172033"/>
  <text x="130" y="708" class="boxTitle" fill="#ffffff">Unitree SportClient.Move()</text>
  <text x="130" y="737" class="boxText" fill="#dce3f2">Only this machine can publish the final motor command</text>

  <rect x="900" y="250" width="600" height="100" rx="16" fill="#ffffff" stroke="#df5c87" stroke-width="2"/>
  <text x="930" y="282" class="boxTitle">Unified CEC Hub · :18889</text>
  <text x="930" y="310" class="boxText">Atomic reset · single-writer state · native fallback · reset-required latch</text>
  <text x="930" y="333" class="boxText">Public contract: /healthz · /navigator_reset · /imagegoal_step</text>

  <rect x="900" y="390" width="275" height="185" rx="16" fill="#ffffff" stroke="#df5c87" stroke-width="2"/>
  <text x="930" y="423" class="boxTitle">MemNav · :18888</text>
  <text x="930" y="452" class="boxText">Causal observation buffer</text>
  <text x="930" y="479" class="boxText">DINO candidate retrieval</text>
  <text x="930" y="506" class="boxText">LightGlue geometry</text>
  <text x="930" y="533" class="boxText">LingBot/PnP bearing</text>
  <text x="930" y="558" class="small">certificate may abstain</text>

  <rect x="1225" y="390" width="275" height="185" rx="16" fill="#ffffff" stroke="#df5c87" stroke-width="2"/>
  <text x="1255" y="423" class="boxTitle">Frozen NavDP · :8888</text>
  <text x="1255" y="452" class="boxText">Native ImageGoal path</text>
  <text x="1255" y="479" class="boxText">or mixed Image + PointGoal</text>
  <text x="1255" y="506" class="boxText">RGB-D local policy</text>
  <text x="1255" y="533" class="boxText">24 trajectory points</text>
  <text x="1255" y="558" class="small">no direct velocity output</text>

  <rect x="900" y="615" width="600" height="105" rx="16" fill="#ffe8f0" stroke="#d94072" stroke-width="3"/>
  <text x="930" y="648" class="boxTitle">Certified directional takeover</text>
  <text x="930" y="676" class="boxText">accepted bearing → normalize → frozen 2.5 m local PointGoal</text>
  <text x="930" y="700" class="boxText">reject/error → exact native ImageGoal NavDP</text>

  <line x1="400" y1="340" x2="400" y2="369" stroke="#d99a00" stroke-width="4" marker-end="url(#arrowGold)"/>
  <line x1="400" y1="480" x2="400" y2="509" stroke="#d99a00" stroke-width="4" marker-end="url(#arrowGold)"/>
  <line x1="400" y1="640" x2="400" y2="669" stroke="#d99a00" stroke-width="4" marker-end="url(#arrowGold)"/>

  <path d="M700 310 C780 310, 820 285, 900 285" fill="none" stroke="#d94072" stroke-width="4" marker-end="url(#arrowPink)"/>
  <text x="800" y="268" text-anchor="middle" class="label">SSH local forward</text>
  <text x="800" y="292" text-anchor="middle" class="small">current RGB + depth + goal</text>

  <path d="M900 745 C820 745, 780 430, 700 430" fill="none" stroke="#d99a00" stroke-width="4" marker-end="url(#arrowGold)"/>
  <text x="800" y="594" text-anchor="middle" class="label">24-point local trajectory</text>
  <text x="800" y="618" text-anchor="middle" class="small">advisory output only</text>

  <line x1="1200" y1="350" x2="1040" y2="384" stroke="#d94072" stroke-width="3" marker-end="url(#arrowPink)"/>
  <line x1="1200" y1="350" x2="1360" y2="384" stroke="#d94072" stroke-width="3" marker-end="url(#arrowPink)"/>
  <line x1="1040" y1="575" x2="1120" y2="609" stroke="#d94072" stroke-width="3" marker-end="url(#arrowPink)"/>
  <line x1="1360" y1="575" x2="1280" y2="609" stroke="#d94072" stroke-width="3" marker-end="url(#arrowPink)"/>

  <text x="800" y="866" text-anchor="middle" class="subtitle">Memory proposes · geometry certifies · NavDP plans locally · the robot decides whether motion is safe</text>
</svg>
