name: Publish Foxglove controls and organization layout

on:
  push:
    branches: [main]
    paths:
      - deployment/go2/foxglove/operator-controls/**
      - deployment/go2/config/navdp_debug.foxglove-layout.json
      - deployment/go2/scripts/sync_foxglove_layout.py
      - .github/workflows/sync-foxglove-layout.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foxglove-operator-ui
  cancel-in-progress: true

jobs:
  sync:
    name: Publish extension, then organization layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXTENSION_DIR: deployment/go2/foxglove/operator-controls
      LAYOUT_FILE: deployment/go2/config/navdp_debug.foxglove-layout.json
      LAYOUT_ID: lay_0eaA5tDP1ifAOz3F
      LAYOUT_NAME: MemNav Go2 Navigation
      LAYOUT_FOLDER: MemNav-RealWorld
      FOXGLOVE_API_KEY: ${{ secrets.FOXGLOVE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deployment/go2/foxglove/operator-controls/package-lock.json

      - name: Validate tracked layout
        run: |
          python3 deployment/go2/scripts/sync_foxglove_layout.py \
            --layout "$LAYOUT_FILE" \
            --layout-id "$LAYOUT_ID" \
            --name "$LAYOUT_NAME" \
            --folder-name "$LAYOUT_FOLDER" \
            --permission ORG_WRITE \
            --dry-run

      - name: Assign unique extension version
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          extension_version="0.1.${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.${short_sha}"
          npm pkg set version="$extension_version"
          echo "EXTENSION_VERSION=$extension_version" >> "$GITHUB_ENV"

      - name: Install extension dependencies
        working-directory: ${{ env.EXTENSION_DIR }}
        run: npm ci

      - name: Lint and package extension
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run package

      - name: Locate FOXE package
        run: |
          mapfile -t packages < <(find "$EXTENSION_DIR" -maxdepth 1 -type f -name '*.foxe' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one .foxe package; found ${#packages[@]}" >&2
            exit 1
          fi
          echo "FOXE_FILE=${packages[0]}" >> "$GITHUB_ENV"

      - name: Store FOXE workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: memnav-operator-controls-${{ github.run_number }}-${{ github.run_attempt }}
          path: deployment/go2/foxglove/operator-controls/*.foxe
          if-no-files-found: error
          retention-days: 30

      - name: Require Foxglove API key
        run: |
          if [ -z "${FOXGLOVE_API_KEY:-}" ]; then
            echo "Missing GitHub Actions secret: FOXGLOVE_API_KEY" >&2
            exit 1
          fi

      - name: Publish extension to Foxglove organization
        run: |
          response="$RUNNER_TEMP/foxglove-extension-result.json"
          status="$({ curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 90 \
            --request POST \
            --header "Authorization: Bearer $FOXGLOVE_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$FOXE_FILE" \
            --output "$response" \
            --write-out '%{http_code}' \
            https://api.foxglove.dev/v1/extension-upload; } || true)"
          case "$status" in
            2??)
              echo "Published MemNav Operator Controls $EXTENSION_VERSION"
              ;;
            *)
              echo "Foxglove extension upload failed with HTTP ${status:-unknown}" >&2
              if [ -s "$response" ]; then
                head -c 2000 "$response" >&2
                echo >&2
              fi
              exit 1
              ;;
          esac

      - name: Create or update organization layout
        run: |
          python3 deployment/go2/scripts/sync_foxglove_layout.py \
            --layout "$LAYOUT_FILE" \
            --layout-id "$LAYOUT_ID" \
            --name "$LAYOUT_NAME" \
            --folder-name "$LAYOUT_FOLDER" \
            --permission ORG_WRITE \
            --result "$RUNNER_TEMP/foxglove-layout-result.json"

      - name: Write workflow summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "foxglove-layout-result.json"
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not result_path.exists():
              summary_path.write_text(
                  "## Foxglove publish\n\n"
                  f"- Extension: `MemNav Operator Controls {os.environ.get('EXTENSION_VERSION', 'unknown')}`\n"
                  "- Layout sync did not produce a result. Review the failed step.\n",
                  encoding="utf-8",
              )
          else:
              result = json.loads(result_path.read_text(encoding="utf-8"))
              layout = result["layout"]
              layout_id = layout["id"]
              link = f"https://app.foxglove.dev/~/view?layoutId={layout_id}"
              summary_path.write_text(
                  "## Foxglove publish\n\n"
                  f"- Extension: `MemNav Operator Controls {os.environ.get('EXTENSION_VERSION', 'unknown')}`\n"
                  f"- Action: `{result['action']}`\n"
                  f"- Layout: `{layout.get('name', 'MemNav Go2 Navigation')}`\n"
                  f"- Layout ID: `{layout_id}`\n"
                  f"- Source SHA-256: `{result['sha256']}`\n"
                  f"- [Open organization layout]({link})\n",
                  encoding="utf-8",
              )
          PY
